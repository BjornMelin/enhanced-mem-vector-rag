[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[project]
name = "enhanced-mem-vector-rag"
version = "1.0.0"
description = "Local SQLite memory for LangGraph agents, with provenance, TTL, export, and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bjorn Melin" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp-slim[server]>=3.4.4,<4",
  "langgraph-checkpoint>=4.1,<5",
  "langgraph-checkpoint-sqlite==3.1.0",
  "pydantic>=2.13,<3",
]

[project.scripts]
emvr-mcp = "emvr.mcp:main"

[project.urls]
Changelog = "https://github.com/BjornMelin/enhanced-mem-vector-rag/blob/main/CHANGELOG.md"
Documentation = "https://github.com/BjornMelin/enhanced-mem-vector-rag#readme"
Issues = "https://github.com/BjornMelin/enhanced-mem-vector-rag/issues"
Repository = "https://github.com/BjornMelin/enhanced-mem-vector-rag"

[dependency-groups]
dev = [
  "fastmcp-slim[client]>=3.4.4,<4",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.sdist]
include = ["/emvr", "/tests", "/docs", "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE", "/README.md", "/SECURITY.md", "/SUPPORT.md"]

[tool.hatch.build.targets.wheel]
packages = ["emvr"]

[tool.pyright]
include = ["emvr", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=emvr --cov-report=term-missing --cov-fail-under=95"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["emvr"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "ASYNC", "B", "C4", "D", "E", "F", "I", "PERF", "PIE", "PL", "RUF", "S", "SIM", "T20", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.uv]
default-groups = ["dev"]
required-version = "==0.11.29"
